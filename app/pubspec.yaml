name: imu_app
description: IM'U — AI Study Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Networking & AI Streaming
  http: ^1.2.1
  dio: ^5.4.3+1
  supabase_flutter: ^2.5.0

  # UI
  flutter_markdown: ^0.7.3+1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Camera/Vision
  image_picker: ^1.1.2

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^15.0.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
