services:
  - type: web
    name: imu-heart
    runtime: python
    rootDir: backend/ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
